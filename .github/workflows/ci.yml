name: Template CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install template test environment
        run: uv sync --locked
      - name: Lint template tests and hooks
        run: uv run ruff check tests hooks
      - name: Check template test and hook formatting
        run: uv run ruff format --check tests hooks
      - name: Render and test generated projects
        run: uv run pytest
